<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Box</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="neal-body">
    <div id="space-bg"></div>
    <canvas id="starfield-canvas"></canvas>

    <div class="neal-container">
        <header class="neal-header">
            <h1 class="neal-title">Physics Box</h1>
            <p class="neal-subtitle">Explore os segredos do universo com simulações interativas.</p>
        </header>

        <!-- Home Page Search Bar -->
        <div class="neal-search-container">
            <input type="text" id="neal-home-search" class="neal-search-input" placeholder="Buscar simulação (ex: pulsar, galáxia, órbitas)...">
        </div>

        <main class="neal-grid">
            <!-- Kepler -->
            <a href="pages/kepler.html" class="neal-card">
                <div class="neal-icon neal-icon-orbit">
                    <div class="orbit-path"></div>
                    <div class="orbit-planet"></div>
                    <div class="orbit-sun"></div>
                </div>
                <h2>Órbitas</h2>
            </a>

            <!-- Stellar -->
            <a href="pages/stellar.html" class="neal-card">
                <div class="neal-icon neal-icon-star">
                    <div class="star-core"></div>
                    <div class="star-pulse"></div>
                </div>
                <h2>Ciclo Estelar</h2>
            </a>

            <!-- Black Hole -->
            <a href="pages/blackhole.html" class="neal-card">
                <div class="neal-icon neal-icon-blackhole">
                    <div class="bh-ring"></div>
                    <div class="bh-core"></div>
                </div>
                <h2>Buracos Negros</h2>
            </a>

            <!-- Pulsar -->
            <a href="pages/pulsar.html" class="neal-card">
                <div class="neal-icon neal-icon-pulsar">
                    <div class="pulsar-beam"></div>
                    <div class="pulsar-core"></div>
                </div>
                <h2>Pulsar</h2>
            </a>

            <!-- Supernova -->
            <a href="pages/supernova.html" class="neal-card">
                <div class="neal-icon neal-icon-supernova">
                    <div class="sn-blast"></div>
                </div>
                <h2>Supernova</h2>
            </a>

            <!-- Galaxy -->
            <a href="pages/galaxy.html" class="neal-card">
                <div class="neal-icon neal-icon-galaxy">
                    <div class="gx-spiral"></div>
                    <div class="gx-spiral-2"></div>
                </div>
                <h2>Galáxias</h2>
            </a>
        </main>
        
        <footer class="neal-footer">
            <p>Desenvolvido para exploração astrofísica educacional. &copy; 2026 Physics Box.</p>
        </footer>
    </div>

    <!-- Minimal JS to init starfield only for home -->
    <script src="js/main.js"></script>
</body>
</html>
